<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Health Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      .tag-UP {
        background: #e6ffed;
        color: #22863a;
      }
      .tag-UP_W {
        background: #fffbdd;
        color: #735c0f;
      }
      .tag-DOWN {
        background: #ffeef0;
        color: #b31d28;
      }
      .tag-HEADER {
        color: #007bff;
        font-weight: bold;
        background: #eef6ff;
      }
      /* สไตล์เพิ่มเติมสำหรับปุ่ม */
      #export-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 p-4 md:p-10">
    <div
      id="dashboard-content"
      class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg border border-gray-100 p-6 md:p-8"
    >
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4"
      >
        <div>
          <h1 class="text-3xl font-bold border-l-8 border-blue-600 pl-4">
            IT System Health
          </h1>
          <p class="text-gray-400 text-sm mt-1">
            Last Update: <span id="last-update">Loading...</span>
          </p>
        </div>

        <div class="flex items-center gap-3">
          <button
            id="refresh-btn"
            class="flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition-all"
          >
            <span>🔄</span> Refresh
          </button>

          <button
            id="export-btn"
            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all"
          >
            <span>📸</span> Export PNG
          </button>
          <div
            id="connection-status"
            class="px-3 py-1 bg-green-100 text-green-700 rounded text-xs font-bold uppercase"
          >
            Connected
          </div>
        </div>
      </div>

      <div class="mb-10">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">
          Summary of Issues
        </h2>
        <div
          id="alerts-container"
          class="bg-gray-50 rounded-lg p-4 border border-gray-100 min-h-[60px]"
        ></div>
      </div>

      <div id="systems-container" class="grid grid-cols-1 gap-6"></div>
    </div>

    <script>
      const socket = io();
      const alertsContainer = document.getElementById("alerts-container");
      const systemsContainer = document.getElementById("systems-container");
      const lastUpdateSpan = document.getElementById("last-update");
      const exportBtn = document.getElementById("export-btn");
      const refreshBtn = document.getElementById("refresh-btn");

      function renderDashboard(data) {
        lastUpdateSpan.innerText = data.lastUpdate;

        // 1. Render Alerts (จัดให้สถานะอยู่ท้ายแถวเช่นกัน)
        if (data.alerts && data.alerts.length > 0) {
          alertsContainer.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
            ${data.alerts.map(alert => `
                <div class="flex justify-between items-center py-1 border-b border-gray-50 text-[12px] font-medium">
                    <span class="${alert.status === "UP_W" ? "text-yellow-600" : "text-red-600"} truncate mr-2">
                        • [${alert.category}] ${alert.name}: ${alert.check}
                    </span>
                    <span class="${alert.status === "UP_W" ? "text-yellow-700" : "text-red-700"} shrink-0 font-bold uppercase">
                        ${alert.result}
                    </span>
                </div>
            `).join("")}
          </div>`;
        } else {
          alertsContainer.innerHTML = '<div class="text-green-600 font-bold text-sm">✔ All systems operational.</div>';
        }

        // 2. จัดกลุ่มข้อมูลตาม Category (เหมือนเดิม)
        const groupedData = data.results.reduce((acc, report) => {
          const cat = report.category || "General";
          if (!acc[cat]) acc[cat] = [];
          acc[cat].push(report);
          return acc;
        }, {});

        // 3. Render Dashboard (ปรับสถานะไปไว้ท้ายแถวทุกจุด)
        systemsContainer.innerHTML = Object.entries(groupedData)
          .map(([category, reports]) => `
            <div class="mb-6">
                <h3 class="text-md font-bold text-blue-800 mb-3 flex items-center gap-2 border-b border-blue-100 pb-1">
                    <span class="w-1.5 h-4 bg-blue-600 rounded-sm"></span>
                    ${category}
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${reports.map(report => `
                        <div class="border border-gray-100 rounded-lg overflow-hidden shadow-sm bg-white flex flex-col">
                            <div class="bg-gray-50 px-3 py-1.5 flex justify-between items-center border-b border-gray-100 font-bold">
                                <span class="text-[12px] truncate mr-2">${report.name}</span>
                                <span class="tag-${report.status} px-1.5 py-0.5 rounded text-[8px] font-black shrink-0 ml-auto uppercase">${report.status}</span>
                            </div>
                            
                            <div class="divide-y divide-gray-50">
                                ${report.details.map(detail => {
                                    const isHeader = detail.status === "HEADER";
                                    
                                    // รายการย่อย: เช็กอยู่ซ้าย ผลลัพธ์อยู่ขวาสุด
                                    if (isHeader) {
                                        return `<div class="px-3 py-1 bg-blue-50/50 text-blue-700 text-[11px] font-bold border-l-4 border-blue-200">
                                            ${detail.result}
                                        </div>`;
                                    }
                                    
                                    return `
                                    <div class="px-3 py-1.5 flex justify-between items-center text-[11px]">
                                        <span class="text-gray-500 truncate mr-2">${detail.check}</span>
                                        <div class="flex items-center gap-2 shrink-0 ml-auto">
                                            <span class="font-bold text-gray-800 text-right">${detail.result}</span>
                                            ${detail.license ? `
                                                <div class="w-10 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                                                    <div class="h-full bg-green-500" style="width: ${detail.license.percent}%"></div>
                                                </div>
                                            ` : ""}
                                            ${detail.status !== "UP" && detail.status !== "HEADER" && detail.status !== "INFO" ? 
                                                `<span class="tag-${detail.status} w-2 h-2 rounded-full inline-block ml-1"></span>` 
                                                : ""}
                                        </div>
                                    </div>`;
                                }).join("")}
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>
          `).join("");
      }
      // Logic สำหรับการ Export รูปภาพ
      exportBtn.addEventListener("click", () => {
        exportBtn.disabled = true;
        exportBtn.innerHTML = "<span>⏳</span> Generating...";

        const dashboard = document.getElementById("dashboard-content");

        html2canvas(dashboard, {
          scale: 2, // เพิ่มความละเอียดภาพเป็น 2 เท่า
          useCORS: true,
          backgroundColor: "#ffffff", // กำหนดพื้นหลังเป็นสีขาว
        })
          .then((canvas) => {
            const link = document.createElement("a");
            const timeStr = new Date()
              .toISOString()
              .replace(/[:.]/g, "-")
              .slice(0, 19);
            link.download = `IT-Health-Report-${timeStr}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();

            exportBtn.disabled = false;
            exportBtn.innerHTML = "<span>📸</span> Export PNG";
          })
          .catch((err) => {
            console.error("Export error:", err);
            alert("ไม่สามารถสร้างรูปภาพได้");
            exportBtn.disabled = false;
            exportBtn.innerHTML = "<span>📸</span> Export PNG";
          });
      });

      refreshBtn.addEventListener("click", async () => {
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = "<span>⏳</span> Checking...";

        try {
          // เรียก API ไปที่ Server เพื่อสั่งให้รัน monitorTask ทันที
          await fetch("/api/trigger-check", { method: "POST" });
          // ข้อมูลจะถูกส่งมาทาง Socket.io เองเมื่อตรวจเสร็จ
        } catch (err) {
          console.error("Refresh failed");
        } finally {
          refreshBtn.disabled = false;
          refreshBtn.innerHTML = "<span>🔄</span> Refresh";
        }
      });

      // โหลดข้อมูลครั้งแรก
      fetch("/api/status")
        .then((res) => res.json())
        .then(renderDashboard);

      // รับข้อมูลอัปเดตผ่าน Socket
      socket.on("update-dashboard", (data) => {
        console.log("Update received!");
        renderDashboard(data);
      });

      socket.on("connect", () => {
        document.getElementById("connection-status").innerText = "Connected";
        document.getElementById("connection-status").className =
          "px-3 py-1 bg-green-100 text-green-700 rounded text-xs font-bold uppercase";
      });

      socket.on("disconnect", () => {
        document.getElementById("connection-status").innerText = "Disconnected";
        document.getElementById("connection-status").className =
          "px-3 py-1 bg-red-100 text-red-700 rounded text-xs font-bold uppercase";
      });
    </script>
  </body>
</html>
