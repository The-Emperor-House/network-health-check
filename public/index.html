<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Health Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
      }
      .tag-UP {
        background: #dcfce7;
        color: #15803d;
      }
      .tag-UP_W {
        background: #fef9c3;
        color: #854d0e;
      }
      .tag-DOWN {
        background: #fee2e2;
        color: #b91c1c;
      }
      .tag-HEADER {
        background: #eff6ff;
        color: #1d4ed8;
        font-weight: 700;
      }
      .tag-UNKNOWN {
        background: #f1f5f9;
        color: #475569;
      }

      /* Animation */
      @keyframes pulse-soft {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      .updating {
        animation: pulse-soft 1.5s infinite;
      }

      .system-card {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .system-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }

      /* ปรับแต่ง Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div id="dashboard-content" class="max-w-7xl mx-auto space-y-6">
      <div
        class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4"
      >
        <div class="flex items-center gap-4">
          <div
            class="bg-blue-600 p-3 rounded-xl shadow-lg shadow-blue-200 text-white text-2xl"
          >
            🛡️
          </div>
          <div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">
              IT Infrastructure Health
            </h1>
            <p class="text-slate-400 text-sm flex items-center gap-2">
              <span id="update-icon">🕒</span> Last Update:
              <span id="last-update" class="font-medium text-slate-600"
                >Loading...</span
              >
            </p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <div
            id="connection-status"
            class="px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-slate-100 text-slate-500 border border-slate-200"
          >
            Connecting...
          </div>
          <button
            id="refresh-btn"
            class="p-2.5 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl border border-slate-200 transition-all active:scale-95"
            title="Refresh Now"
          >
            🔄
          </button>
          <button
            id="export-btn"
            class="flex items-center gap-2 bg-slate-900 hover:bg-black text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-md active:scale-95"
          >
            📸 Export Report
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-slate-500 text-xs font-bold uppercase tracking-wider">
            Total Checks
          </p>
          <p id="stat-total" class="text-2xl font-black text-slate-800 mt-1">
            0
          </p>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-green-600 text-xs font-bold uppercase tracking-wider">
            Operational
          </p>
          <p id="stat-up" class="text-2xl font-black text-green-600 mt-1">0</p>
        </div>
        <div
          class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm border-l-4 border-l-amber-400"
        >
          <p class="text-amber-600 text-xs font-bold uppercase tracking-wider">
            Warnings
          </p>
          <p id="stat-warning" class="text-2xl font-black text-amber-600 mt-1">
            0
          </p>
        </div>
        <div
          class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm border-l-4 border-l-red-500"
        >
          <p class="text-red-600 text-xs font-bold uppercase tracking-wider">
            Critical Issues
          </p>
          <p id="stat-down" class="text-2xl font-black text-red-600 mt-1">0</p>
        </div>
      </div>

      <div
        class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden"
      >
        <div
          class="bg-slate-50 px-6 py-3 border-b border-slate-200 flex justify-between items-center"
        >
          <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
            🚨 Summary of Issues
          </h2>
          <span
            id="alert-badge"
            class="bg-red-100 text-red-600 text-[10px] px-2 py-0.5 rounded-full font-bold"
            >0 Active</span
          >
        </div>
        <div id="alerts-container" class="p-4 min-h-[50px]"></div>
      </div>

      <div id="systems-container" class="grid grid-cols-1 gap-8"></div>
    </div>

    <script>
      const socket = io();
      const alertsContainer = document.getElementById("alerts-container");
      const systemsContainer = document.getElementById("systems-container");
      const lastUpdateSpan = document.getElementById("last-update");

      // ฟังก์ชันตัวเลขสรุป
      function updateStats(data) {
        if (!data.results) return;
        const total = data.results.reduce(
          (acc, r) => acc + r.details.length,
          0,
        );
        const up = data.results.filter((r) => r.status === "UP").length;
        const warning = data.results.filter((r) => r.status === "UP_W").length;
        const down = data.results.filter((r) => r.status === "DOWN").length;

        document.getElementById("stat-total").innerText = total;
        document.getElementById("stat-up").innerText = up;
        document.getElementById("stat-warning").innerText = warning;
        document.getElementById("stat-down").innerText = down;
        document.getElementById("alert-badge").innerText =
          `${data.alerts?.length || 0} Issues`;
      }

      function renderDashboard(data) {
        lastUpdateSpan.innerText = data.lastUpdate;
        updateStats(data);

        // 1. Render Alerts
        if (data.alerts && data.alerts.length > 0) {
          alertsContainer.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2">
            ${data.alerts
              .map(
                (alert) => `
                <div class="flex justify-between items-center p-2 rounded-lg bg-slate-50 border border-slate-100 animate-in fade-in duration-300">
                    <span class="text-xs font-semibold ${alert.status === "UP_W" ? "text-amber-700" : "text-red-700"} truncate">
                        • [${alert.category}] ${alert.check}
                    </span>
                    <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${alert.status === "UP_W" ? "bg-amber-100 text-amber-700" : "bg-red-100 text-red-700"}">
                        ${alert.result}
                    </span>
                </div>
            `,
              )
              .join("")}
          </div>`;
        } else {
          alertsContainer.innerHTML =
            '<div class="text-green-600 font-bold text-sm py-2 flex items-center gap-2">✅ ทุกระบบทำงานได้ตามปกติ (All systems operational)</div>';
        }

        // 2. Grouping
        const groupedData = data.results.reduce((acc, report) => {
          const cat = report.category || "General";
          if (!acc[cat]) acc[cat] = [];
          acc[cat].push(report);
          return acc;
        }, {});

        // 3. Render Systems Grid
        systemsContainer.innerHTML = Object.entries(groupedData)
          .map(
            ([category, reports]) => `
            <div class="space-y-4">
                <div class="flex items-center gap-3">
                    <h3 class="text-sm font-black text-slate-400 uppercase tracking-[0.2em]">${category}</h3>
                    <div class="h-[1px] bg-slate-200 flex-grow"></div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    ${reports
                      .map(
                        (report) => `
                        <div class="system-card bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col">
                            <div class="px-4 py-3 flex justify-between items-center border-b border-slate-100 bg-slate-50/50">
                                <span class="text-[13px] font-bold text-slate-700 truncate mr-2">${report.name}</span>
                                <span class="tag-${report.status} px-2 py-0.5 rounded-full text-[9px] font-black tracking-tighter uppercase shrink-0">${report.status}</span>
                            </div>
                            
                            <div class="p-2 space-y-1">
                                ${report.details
                                  .map((detail) => {
                                    if (detail.status === "HEADER") {
                                      return `<div class="px-3 py-1 text-[10px] font-black text-blue-600 uppercase tracking-wide bg-blue-50/50 rounded-md">
                                            ${detail.result}
                                        </div>`;
                                    }

                                    return `
                                    <div class="px-3 py-2 flex justify-between items-center group">
                                        <span class="text-[11px] text-slate-500 font-medium group-hover:text-slate-800 transition-colors">${detail.check}</span>
                                        <div class="flex items-center gap-2">
                                            <span class="text-[11px] font-bold text-slate-900">${detail.result}</span>
                                            ${
                                              detail.status !== "UP" &&
                                              detail.status !== "INFO"
                                                ? `<span class="w-2 h-2 rounded-full ${detail.status === "DOWN" ? "bg-red-500" : "bg-amber-400"} animate-pulse"></span>`
                                                : ""
                                            }
                                        </div>
                                    </div>`;
                                  })
                                  .join("")}
                            </div>
                        </div>
                    `,
                      )
                      .join("")}
                </div>
            </div>
          `,
          )
          .join("");
      }

      // Logic Control
      const refreshBtn = document.getElementById("refresh-btn");
      refreshBtn.addEventListener("click", async () => {
        refreshBtn.classList.add("updating");
        refreshBtn.disabled = true; // ป้องกันการกดซ้ำซ้อน

        try {
          // ยิงไปที่ Endpoint ที่เราแก้ใน server.js
          const response = await fetch("/api/trigger-check", {
            method: "POST",
          });
          const resData = await response.json();
          console.log("Check Triggered:", resData.message);
        } catch (err) {
          console.error("Manual refresh failed:", err);
        } finally {
          // รอสักครู่เพื่อให้ Animation ทำงานเสร็จก่อนปลดล็อกปุ่ม
          setTimeout(() => {
            refreshBtn.classList.remove("updating");
            refreshBtn.disabled = false;
          }, 2000);
        }
      });

      const exportBtn = document.getElementById("export-btn");
      exportBtn.addEventListener("click", () => {
        const originalBtnText = exportBtn.innerHTML;
        exportBtn.disabled = true;
        exportBtn.innerHTML = "<span>⏳</span> Generating...";

        const dashboard = document.getElementById("dashboard-content");

        html2canvas(dashboard, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#f8fafc", // สีพื้นหลังเดียวกับ Body
          logging: false,
          // จุดสำคัญ: กำหนดความสูงตามความสูงจริงของ Dashboard
          height: dashboard.scrollHeight + 50,
          y: window.scrollY, // จับภาพจากตำแหน่ง Scroll ปัจจุบัน
          onclone: (clonedDoc) => {
            // ปรับแต่ง Dashboard ใน Clone ก่อนถ่ายภาพ
            const clonedDashboard =
              clonedDoc.getElementById("dashboard-content");
            clonedDashboard.style.overflow = "visible";
            clonedDashboard.style.height = "auto";
            clonedDashboard.style.paddingTop = "30px"; // แก้ปัญหาหัวข้อ Data Center โดนตัด
            clonedDashboard.style.paddingBottom = "30px"; // แก้ปัญหาด้านล่างโดนตัด
          },
        })
          .then((canvas) => {
            const link = document.createElement("a");
            const timestamp = new Date().getTime();
            link.download = `IT-Health-Report-${timestamp}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();

            exportBtn.disabled = false;
            exportBtn.innerHTML = originalBtnText;
          })
          .catch((err) => {
            console.error("Export error:", err);
            exportBtn.disabled = false;
            exportBtn.innerHTML = originalBtnText;
          });
      });

      // Connection Status
      socket.on("connect", () => {
        const el = document.getElementById("connection-status");
        el.innerText = "● LIVE CONNECTED";
        el.className =
          "px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-green-100 text-green-700 border border-green-200";
      });

      socket.on("disconnect", () => {
        const el = document.getElementById("connection-status");
        el.innerText = "● DISCONNECTED";
        el.className =
          "px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-red-100 text-red-700 border border-red-200";
      });

      socket.on("update-dashboard", renderDashboard);

      // Initial Load
      fetch("/api/status")
        .then((r) => r.json())
        .then(renderDashboard);
    </script>
  </body>
</html>
